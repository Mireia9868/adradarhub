services:
  - type: web
    name: adradarhub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - adradarhub.com
      - www.adradarhub.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONNECTOR_TIMEOUT_MS
        value: "15000"
      - key: CONNECTOR_CURL_FALLBACK
        value: "true"
      - key: BING_AD_LIBRARY_DIRECT
        value: "true"
      - key: BING_AD_LIBRARY_LIMIT
        value: "24"
      - key: BING_AD_LIBRARY_BASE_URL
        value: https://adlibrary.api.bingads.microsoft.com/api/v1/Ads
      - key: META_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_TRANSPARENCY_ENDPOINT
        sync: false
      - key: TRANSPARENCY_CONNECTOR_TOKEN
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_API_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/api/v1
      # 外部生图代理（Cloudflare Worker，已部署）。配置后 /api/generate-image 走此端点，
      # 密钥只存在 Worker 侧；未配置时回退到内置 Qwen（需 QWEN_API_KEY）。
      - key: IMAGE_GEN_ENDPOINT
        value: https://adradarhub.mireia9868.workers.dev/generate-image
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_BASE_URL
        value: https://api.deepseek.com
      # YouTube Data API v3 密钥（Google Cloud Console 创建，仅限 youtube.googleapis.com）。
      # 值在 Render Dashboard 手动填入，不落仓库。
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_SEARCH_LIMIT
        value: "15"
      # TikTok 视频情报数据源（TikHub REST）。官方无可用的公开数据 API，
      # Display API 只能读授权用户自己的视频，Research API 限定非营利学术机构。
      # 值在 Render Dashboard 手动填入，不落仓库。
      - key: TIKTOK_API_KEY
        sync: false
      - key: TIKTOK_PROVIDER
        value: tikhub
      # Render 在新加坡，走国际域名；本地在中国大陆用 .env 改成 https://api.tikhub.dev
      - key: TIKTOK_API_BASE_URL
        value: https://api.tikhub.io
      - key: TIKTOK_SEARCH_LIMIT
        value: "20"
      - key: TIKTOK_SORT_TYPE
        value: "0"
      # 账号体系：Supabase Postgres + scrypt/HMAC 自实现会话。
      # 三个变量都配齐后才会启用登录与每日配额，否则自动降级为免登录。
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: DAILY_QUOTA
        value: "10"
      - key: QUOTA_UTC_OFFSET
        value: "8"
